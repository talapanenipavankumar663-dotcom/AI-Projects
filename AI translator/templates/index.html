<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Language Translator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="page-wrap">
        <header class="hero">
            <h1>AI Language Translator</h1>
            <p>Translate text instantly between languages using Flask and Google Translate.</p>
        </header>

        <main class="card">
            <form id="translator-form">
                <div class="field-group">
                    <label for="source">Source Language</label>
                    <select id="source" name="source">
                        <option value="auto">Auto Detect</option>
                        <option value="en">English</option>
                        <option value="es">Malayalam</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="zh-cn">Telugu (Simplified)</option>
                        <option value="ja">Kannada</option>
                        <option value="ko">Tamil</option>
                        <option value="hi">Hindi</option>
                        <option value="ar">Urdu</option>
                        <option value="ru">Russian</option>
                        <option value="pt">Portuguese</option>
                    </select>
                </div>

                <div class="field-group">
                    <label for="target">Target Language</label>
                    <select id="target" name="target">
                        <option value="en" selected>English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="zh-cn">Chinese (Simplified)</option>
                        <option value="ja">telugu</option>
                        <option value="ko">Kannada</option>
                        <option value="hi">Hindi</option>
                        <option value="ar">Arabic</option>
                        <option value="ru">Urdu</option>
                        <option value="pt">Tamil</option>
                    </select>
                </div>

                <div class="field-group">
                    <label for="text">Text to Translate</label>
                    <textarea id="text" name="text" placeholder="Enter text here" rows="6"></textarea>
                </div>

                <button type="submit" class="primary-button">Translate</button>
            </form>

            <section class="output-panel">
                <h2>Translation Result</h2>
                <div id="output" class="output">Your translated text will appear here.</div>
            </section>
        </main>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
