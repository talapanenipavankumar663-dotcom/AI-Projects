# Memory-optimized Gradle settings for systems with 4-8GB RAM
# Keeps JVM heap under 1.5GB to avoid Windows Out-Of-Memory VMThread crashes
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false

# AndroidX package structure
android.useAndroidX=true

# Single architecture build for fast compilation and low memory footprint
reactNativeArchitectures=arm64-v8a

# New Architecture & Hermes flags
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=false
