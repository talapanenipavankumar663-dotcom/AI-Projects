<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">EMS</a>
      </div>
    </nav>

    <div class="container mt-4">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, msg in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
              {{ msg }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Edit Employee</h5>
          <form method="post" novalidate>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Name</label>
                <input name="name" class="form-control" required value="{{ emp['name'] }}">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input name="email" type="email" class="form-control" required value="{{ emp['email'] }}">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Phone</label>
                <input name="phone" class="form-control" required value="{{ emp['phone'] }}">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Department</label>
                <input name="department" class="form-control" required value="{{ emp['department'] }}">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Salary</label>
                <input name="salary" type="number" step="0.01" class="form-control" required value="{{ emp['salary'] }}">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Joining Date</label>
                <input name="joining_date" type="date" class="form-control" required value="{{ emp['joining_date'] }}">
              </div>
            </div>
            <div class="mt-3">
              <button class="btn btn-primary">Update</button>
              <a class="btn btn-secondary" href="/">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
