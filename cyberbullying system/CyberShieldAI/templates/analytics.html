<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Analytics - CyberShield AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="p-4">
    <a href="/dashboard" class="btn btn-link">Back</a>
    <h3>Analytics</h3>
    <div class="row mt-3">
      <div class="col-md-6">
        <canvas id="pieChart"></canvas>
      </div>
      <div class="col-md-6">
        <canvas id="barChart"></canvas>
      </div>
    </div>
    <div class="row mt-4">
      <div class="col-md-12">
        <canvas id="trendChart"></canvas>
      </div>
    </div>
    <script>
      const labels = {{ labels|tojson }};
      const counts = {{ counts|tojson }};
      const trend = {{ trend|tojson }};
      const days = trend.map(t => t[0]);
      const dayCounts = trend.map(t => t[1]);
      new Chart(document.getElementById('pieChart'), {type:'pie', data:{labels:labels, datasets:[{data:counts, backgroundColor:['#dc3545','#ffc107','#6f42c1','#20c997','#198754']} ]}});
      new Chart(document.getElementById('barChart'), {type:'bar', data:{labels:labels, datasets:[{label:'Counts', data:counts, backgroundColor:'#0d6efd'}]}});
      new Chart(document.getElementById('trendChart'), {type:'line', data:{labels:days, datasets:[{label:'Posts', data:dayCounts, borderColor:'#fd7e14', fill:false}]}});
    </script>
  </body>
</html>
