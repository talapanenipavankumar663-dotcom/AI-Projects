<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - CyberShield AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
  </head>
  <body class="p-4">
    <a href="/dashboard" class="btn btn-link">Back</a>
    <h3>Admin Panel</h3>
    <h5 class="mt-3">Users</h5>
    <table class="table table-striped">
      <thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th></tr></thead>
      <tbody>
        {% for u in users %}
        <tr><td>{{ u.id }}</td><td>{{ u.username }}</td><td>{{ u.email }}</td><td>{{ u.role }}</td></tr>
        {% endfor %}
      </tbody>
    </table>
    <h5 class="mt-3">Posts</h5>
    <table class="table table-striped">
      <thead><tr><th>ID</th><th>User</th><th>Text</th><th>Prediction</th><th>Actions</th></tr></thead>
      <tbody>
        {% for p in posts %}
        <tr><td>{{ p.id }}</td><td>{{ p.user_id }}</td><td>{{ p.post_text[:80] }}</td><td>{{ p.prediction }}</td>
        <td><a href="/admin/delete_post/{{ p.id }}" class="btn btn-sm btn-danger">Delete</a></td></tr>
        {% endfor %}
      </tbody>
    </table>
  </body>
</html>
