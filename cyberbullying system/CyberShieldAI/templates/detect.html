<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simulator - CyberShield AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
  </head>
  <body>
    <div class="container mt-4">
      <a href="/dashboard" class="btn btn-link">Back</a>
      <h2>Social Media Simulator</h2>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Post</label>
          <textarea id="post_text" name="post_text" class="form-control" rows="4"></textarea>
        </div>
        <div class="mb-3">
          <div id="realtime_result" class="p-3 border d-none"></div>
        </div>
        <button class="btn btn-primary">Submit Post</button>
      </form>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/static/js/script.js"></script>
  </body>
</html>
